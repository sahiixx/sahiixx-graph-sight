[project]
name = "graph-sight"
version = "0.1.0"
description = "codesight + Neo4j trust graph = relationship-aware context for AI agents"
requires-python = ">=3.12"
authors = [{ name = "Sahiixx", email = "sahiix@github.com" }]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "neo4j>=5.15",
    "tree-sitter>=0.20",
    "tree-sitter-python>=0.20",
    "tree-sitter-javascript>=0.20",
    "tree-sitter-typescript>=0.20",
    "rich>=13.0",
    "typer>=0.9",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.0"]

[project.scripts]
graph-sight = "graph_sight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_sight"]
